name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }} ${{ matrix.sanitizer }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        build_type: [Release, Debug]
        sanitizer: [""]
        include:
          - os: ubuntu-22.04
            build_type: Debug
            sanitizer: address
          - os: ubuntu-22.04
            build_type: Debug
            sanitizer: undefined
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSLATE_SANITIZE=${{ matrix.sanitizer }} \
            -DSLATE_BUILD_TESTS=ON \
            -DSLATE_BUILD_EXAMPLES=ON
        shell: bash
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j
      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}
      - name: Run XOR example
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build/examples/${{ matrix.build_type }}/slate_xor.exe
          else
            ./build/examples/slate_xor
          fi
        shell: bash

  format-check:
    name: clang-format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-14
      - name: Run clang-format
        run: |
          find src include tests examples -name '*.c' -o -name '*.h' \
              | xargs clang-format-14 --dry-run --Werror

  lint-headers:
    name: layering check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check that no src/ file includes a header from a layer above it
        run: |
          # M0 has no upward includes by construction; this is the placeholder
          # for the real layer checker that arrives in M2.
          echo "layering check passed (placeholder)"
