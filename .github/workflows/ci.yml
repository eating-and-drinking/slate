# SPDX-License-Identifier: Apache-2.0
# Continuous integration: build slate on Linux x86_64 (AVX2),
# then run the full ctest suite.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build + test (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential python3
          cmake --version
          gcc --version

      - name: Generate GGUF test fixtures
        run: |
          python3 tools/make_test_gguf.py
          python3 tools/make_q8_gguf.py

      - name: Configure
        run: |
          cmake -B build \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DSLATE_BUILD_TESTS=ON \
                -DSLATE_BUILD_EXAMPLES=ON \
                -DSLATE_ENABLE_AVX2=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --timeout 120

      - name: Smoke-run inference server example
        run: |
          timeout 30 ./build/examples/slate_inference_server

  sanitizers:
    name: ASAN + UBSAN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential python3
      - name: Build with sanitizers
        run: |
          cmake -B build-asan \
                -DCMAKE_BUILD_TYPE=Debug \
                -DSLATE_SANITIZE=address,undefined
          cmake --build build-asan --parallel
      - name: Generate fixtures
        run: |
          python3 tools/make_test_gguf.py
          python3 tools/make_q8_gguf.py
      - name: Run tests under sanitizers
        working-directory: build-asan
        run: ctest --output-on-failure --timeout 240
